version: '3.8'

services:
  # PPR1 - Simulates your first pre-production environment
  ppr1:
    image: ${DOCKER_IMAGE:-my-app:latest}
    container_name: my-app-ppr1
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=ppr1
      - PORT=5000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # PPR2 - Simulates your second pre-production environment
  ppr2:
    image: ${DOCKER_IMAGE:-my-app:latest}
    container_name: my-app-ppr2
    ports:
      - "5001:5000"
    environment:
      - NODE_ENV=ppr2
      - PORT=5000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
