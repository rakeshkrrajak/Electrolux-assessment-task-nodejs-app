services:
  ppr1:
    image: ${DOCKER_IMAGE:-my-app:latest}
    container_name: my-app-ppr1
    restart: unless-stopped

    ports:
      - "5000:5000"

    environment:
      NODE_ENV: ppr1
      PORT: 5000

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  ppr2:
    image: ${DOCKER_IMAGE:-my-app:latest}
    container_name: my-app-ppr2
    restart: unless-stopped

    ports:
      - "5001:5000"

    environment:
      NODE_ENV: ppr2
      PORT: 5000

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s