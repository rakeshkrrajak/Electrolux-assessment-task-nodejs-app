name: Deploy to PPR Environments (Simulated - Docker Hub)

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  # =====================
  # 1. BUILD & TEST
  # =====================
  build-and-push:
    name: Build, Test & Push to Docker Hub
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    outputs:
      image-tag: ${{ steps.tag.outputs.value }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get Short Commit SHA
        id: tag
        run: echo "value=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test || echo "No tests found - skipping"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/my-app:${{ steps.tag.outputs.value }}
            ${{ secrets.DOCKERHUB_USERNAME }}/my-app:latest

      - name: Run Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/my-app:${{ steps.tag.outputs.value }}
          format: table
          exit-code: 0

      - name: Summary
        run: |
          echo "### Build Complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ secrets.DOCKERHUB_USERNAME }}/my-app:${{ steps.tag.outputs.value }}\`" >> $GITHUB_STEP_SUMMARY

  # =====================
  # 2. DEPLOY TO PPR1 (Auto)
  # =====================
  deploy-ppr1:
    name: Deploy to PPR1 (Auto)
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: ppr1

    steps:
      - name: Simulate PPR1 Deployment
        run: |
          echo "🚀 Deploying to PPR1..."
          echo "📦 Image: ${{ secrets.DOCKERHUB_USERNAME }}/my-app:${{ needs.build-and-push.outputs.image-tag }}"
          echo ""

          # Simulate: pull image
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/my-app:${{ needs.build-and-push.outputs.image-tag }}

          # Simulate: stop old container
          docker stop my-app-ppr1 2>/dev/null || true
          docker rm my-app-ppr1 2>/dev/null || true

          # Simulate: run new container
          docker run -d \
            --name my-app-ppr1 \
            -p 5000:5000 \
            ${{ secrets.DOCKERHUB_USERNAME }}/my-app:${{ needs.build-and-push.outputs.image-tag }}

          echo "⏳ Waiting for app to start..."
          sleep 5

      - name: Health Check PPR1
        run: |
          echo "🏥 Running PPR1 health check..."
          for i in {1..10}; do
            if curl -f http://localhost:5000/health; then
              echo ""
              echo "✅ PPR1 health check PASSED"
              exit 0
            fi
            echo "Attempt $i/10 - waiting..."
            sleep 2
          done
          echo "❌ PPR1 health check FAILED"
          docker logs my-app-ppr1
          exit 1

      - name: PPR1 Summary
        run: |
          echo "### PPR1 Deployed ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Port:** 5000" >> $GITHUB_STEP_SUMMARY
          echo "- **Health:** Passed" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${{ needs.build-and-push.outputs.image-tag }}\`" >> $GITHUB_STEP_SUMMARY

  # =====================
  # 3. DEPLOY TO PPR2 (Requires Approval)
  # =====================
  deploy-ppr2:
    name: Deploy to PPR2 (Manual Approval Required)
    runs-on: ubuntu-latest
    needs: deploy-ppr1
    environment:
      name: ppr2

    steps:
      - name: Simulate PPR2 Deployment
        run: |
          echo "🚀 Deploying to PPR2..."
          echo "📦 Image: ${{ secrets.DOCKERHUB_USERNAME }}/my-app:${{ needs.build-and-push.outputs.image-tag }}"
          echo ""

          # Simulate: pull image
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/my-app:${{ needs.build-and-push.outputs.image-tag }}

          # Simulate: stop old container
          docker stop my-app-ppr2 2>/dev/null || true
          docker rm my-app-ppr2 2>/dev/null || true

          # Simulate: run new container on port 5001
          docker run -d \
            --name my-app-ppr2 \
            -p 5001:5000 \
            ${{ secrets.DOCKERHUB_USERNAME }}/my-app:${{ needs.build-and-push.outputs.image-tag }}

          echo "⏳ Waiting for app to start..."
          sleep 5

      - name: Health Check PPR2
        run: |
          echo "🏥 Running PPR2 health check..."
          for i in {1..10}; do
            if curl -f http://localhost:5001/health; then
              echo ""
              echo "✅ PPR2 health check PASSED"
              exit 0
            fi
            echo "Attempt $i/10 - waiting..."
            sleep 2
          done
          echo "❌ PPR2 health check FAILED"
          docker logs my-app-ppr2
          exit 1

      - name: PPR2 Summary
        run: |
          echo "### PPR2 Deployed ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Port:** 5001" >> $GITHUB_STEP_SUMMARY
          echo "- **Health:** Passed" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${{ needs.build-and-push.outputs.image-tag }}\`" >> $GITHUB_STEP_SUMMARY

  # =====================
  # 4. FINAL SUMMARY
  # =====================
  pipeline-summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-ppr1, deploy-ppr2]
    if: always()

    steps:
      - name: Print Final Status
        run: |
          echo "╔══════════════════════════════════╗"
          echo "║      DEPLOYMENT COMPLETE 🚀      ║"
          echo "╚══════════════════════════════════╝"
          echo ""
          echo "  Build & Push : ${{ needs.build-and-push.result }}"
          echo "  PPR1 Deploy  : ${{ needs.deploy-ppr1.result }}"
          echo "  PPR2 Deploy  : ${{ needs.deploy-ppr2.result }}"
          echo ""
          echo "  Image Tag    : ${{ needs.build-and-push.outputs.image-tag }}"
          echo ""
          echo "  PPR1 URL     : http://runner:5000"
          echo "  PPR2 URL     : http://runner:5001"
