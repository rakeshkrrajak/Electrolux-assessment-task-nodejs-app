name: Build and Deploy

on:
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  build:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Generate image tag
        id: version
        run: |
          echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/my-app:${{ steps.version.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/my-app:latest

      - name: Security scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/my-app:${{ steps.version.outputs.tag }}
          format: table
          exit-code: "0"

  deploy-ppr1:
    needs: build
    runs-on: ubuntu-latest
    environment: ppr1

    steps:
      - name: Deploy application
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/my-app:${{ needs.build.outputs.image_tag }}

          docker pull $IMAGE
          docker stop my-app-ppr1 || true
          docker rm my-app-ppr1 || true

          docker run -d \
            --name my-app-ppr1 \
            -p 5000:5000 \
            $IMAGE

      - name: Verify deployment
        run: |
          sleep 10
          curl -f http://localhost:5000/health

  deploy-ppr2:
    needs:
      - build
      - deploy-ppr1
    runs-on: ubuntu-latest
    environment: ppr2

    steps:
      - name: Deploy application
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/my-app:${{ needs.build.outputs.image_tag }}

          docker pull $IMAGE
          docker stop my-app-ppr2 || true
          docker rm my-app-ppr2 || true

          docker run -d \
            --name my-app-ppr2 \
            -p 5001:5000 \
            $IMAGE

      - name: Verify deployment
        run: |
          sleep 10
          curl -f http://localhost:5001/health