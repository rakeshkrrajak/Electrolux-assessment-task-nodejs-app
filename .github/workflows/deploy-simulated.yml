name: Build and Deploy

on:
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  build:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      image_tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Generate image tag
        id: version
        run: echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build locally first so Trivy scans before the image is public
      - name: Build image (local only)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-app:${{ steps.version.outputs.tag }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/my-app:${{ steps.version.outputs.tag }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Only push after scan passes
      - name: Push image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/my-app:${{ steps.version.outputs.tag }}

  deploy-ppr1:
    needs: build
    runs-on: ubuntu-latest
    environment: ppr1
    permissions:
      contents: read

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Deploy to PPR1
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/my-app:${{ needs.build.outputs.image_tag }}
          docker pull $IMAGE
          docker stop my-app-ppr1 || true
          docker rm   my-app-ppr1 || true
          docker run -d \
            --name my-app-ppr1 \
            -p 5000:5000 \
            -e GIT_COMMIT=${{ needs.build.outputs.image_tag }} \
            $IMAGE

      - name: Verify PPR1 health and version
        run: |
          for i in $(seq 1 15); do
            curl -sf http://localhost:5000/health && break
            echo "attempt $i/15, retrying..."
            sleep 2
          done
          curl -f http://localhost:5000/health
          curl -sf http://localhost:5000/version | grep -q "${{ needs.build.outputs.image_tag }}"

  deploy-ppr2:
    needs:
      - build
      - deploy-ppr1
    runs-on: ubuntu-latest
    environment: ppr2
    permissions:
      contents: read

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Deploy to PPR2
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/my-app:${{ needs.build.outputs.image_tag }}
          docker pull $IMAGE
          docker stop my-app-ppr2 || true
          docker rm   my-app-ppr2 || true
          docker run -d \
            --name my-app-ppr2 \
            -p 5001:5000 \
            -e GIT_COMMIT=${{ needs.build.outputs.image_tag }} \
            $IMAGE

      - name: Verify PPR2 health and version
        run: |
          for i in $(seq 1 15); do
            curl -sf http://localhost:5001/health && break
            echo "attempt $i/15, retrying..."
            sleep 2
          done
          curl -f http://localhost:5001/health
          curl -sf http://localhost:5001/version | grep -q "${{ needs.build.outputs.image_tag }}"